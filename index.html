<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale / user-scalable 은 쓰지 않는다 — 확대해서 보는 사람을 막는다.
         iOS 의 입력 포커스 확대는 입력칸 글자를 16px 이상으로 두어 막는다(styles.css 의 --input-font). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2a78d6" />
    <meta name="description" content="우리 가족 가계부" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
    <link rel="icon" href="/icons/favicon-16.png" sizes="16x16" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- iOS 홈 화면 앱 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="머니키퍼" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>머니키퍼 · 가계부</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
